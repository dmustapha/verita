<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Verita concept A">
  <title>Concept A — Slashed stake: a staked coin cut by the slash</title>
  <defs>
    <clipPath id="topA"><path d="M0 0 H64 V64 L0 0 Z"/></clipPath>
    <clipPath id="botA"><path d="M0 0 L64 64 H0 Z"/></clipPath>
  </defs>
  <!-- upper-left half of the stake: intact, teal -->
  <g clip-path="url(#topA)"><circle cx="32" cy="32" r="22" fill="#2dd4bf"/></g>
  <!-- lower-right half: slashed away, offset, red edge -->
  <g clip-path="url(#botA)" transform="translate(5.5 5.5)"><circle cx="32" cy="32" r="22" fill="#0e1a19" stroke="#ff6a5f" stroke-width="3.5"/></g>
  <!-- the slash line itself -->
  <line x1="8" y1="8" x2="56" y2="56" stroke="#ff6a5f" stroke-width="5" stroke-linecap="round"/>
</svg>
