<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Verita">
  <title>Verita logomark — a seal that can be broken, and a verified mark</title>
  <!-- seal ring with a break (accountability: the seal can be broken / the stake slashed) -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#2dd4bf" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="122 28.8" transform="rotate(-58 32 32)"/>
  <!-- verified mark inside -->
  <path d="M21 33 l7.5 8 L44 21" fill="none" stroke="#2dd4bf" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
