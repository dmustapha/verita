name: ci
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Release gate (build + offline test suite)
        run: bash scripts/verify.sh
